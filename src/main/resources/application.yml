server:
  # IDE 本机启动默认只绑本机；OrbStack / Docker 里用 SERVER_ADDRESS=0.0.0.0
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8092}

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s

fresh:
  zone: Asia/Shanghai
  # 北京时间周一到周五 20:30，对应美东盘前
  premarket-cron: "0 30 20 * * MON-FRI"
  # 北京时间周二到周六 06:30，对应美东前一交易日收盘之后
  recap-cron: "0 30 6 * * TUE-SAT"
  lookback-hours: 24
  cluster-trigger: 5
  cluster-keep: 3
  mover-percent: 1.0
  tree-news-ms: 2000
  watchlist:
    - SPY
    - QQQ
    - NVDA
    - AAPL
    - MSFT
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AMD
    - AVGO
    - USO
    - GLD
    - VIX
