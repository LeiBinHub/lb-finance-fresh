server:
  # IDE 本机启动默认只绑本机；OrbStack / Docker 里用 SERVER_ADDRESS=0.0.0.0
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8092}

spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s

fresh:
  zone: Asia/Shanghai
  lookback-hours: 24
  cluster-trigger: 5
  cluster-keep: 3
  mover-percent: 1.0
  tree-news-ms: 2000
  watchlist:
    - SPY
    - QQQ
    - NVDA
    - AAPL
    - MSFT
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AMD
    - AVGO
    - USO
    - GLD
    - VIX
