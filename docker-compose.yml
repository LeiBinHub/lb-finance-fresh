services:
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    # 不映射到本机：6379 常被已有 Redis 占用。应用走 compose 网络里的服务名 redis。
    # 若要用 IDE 连这台 Redis，再加 ports: ["127.0.0.1:6380:6379"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:21-jre}
    ports:
      - "127.0.0.1:8092:8092"
    env_file:
      - .env
    environment:
      # Compose 网络里用服务名；覆盖 .env 里给 IDE 用的 127.0.0.1
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 容器内必须监听 0.0.0.0，本机才能访问映射端口
      SERVER_ADDRESS: "0.0.0.0"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - redis
    restart: unless-stopped

  telegram-listen:
    build:
      context: ./telegram-listen
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      TELEGRAM_SESSION_PATH: /app/data/telegram
      TELEGRAM_INGEST_URL: http://app:8092/api/tree-news/ingest
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis-data:
